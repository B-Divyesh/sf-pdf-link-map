[package]
name = "pdf-link-map"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Audit link annotations and destinations in PDFs"
readme = "../../README.md"
keywords = ["pdf", "links", "audit", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "pdf-link-map"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lopdf = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

